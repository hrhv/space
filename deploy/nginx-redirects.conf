# Nginx 301 redirect rules for harshitbudhraja.com
# Paste these inside the `server {}` block in Nginx Proxy Manager
# (Advanced tab → Custom Nginx Configuration).
#
# These redirect all old Hashnode root-level URLs to their new /blog/* locations.
# These are the authoritative 301s for SEO — the Astro config only does
# client-side meta-refresh in static output mode.

# ── Individual posts ──────────────────────────────────────────────────────────

rewrite ^/port-a-website-to-the-dark-web-in-under-2-minutes(/?)$
    /blog/port-a-website-to-the-dark-web-in-under-2-minutes$1 permanent;

rewrite ^/what-is-an-api(/?)$
    /blog/what-is-an-api$1 permanent;

rewrite ^/types-of-apis-rest-vs-soap(/?)$
    /blog/types-of-apis-rest-vs-soap$1 permanent;

rewrite ^/using-1password-for-free-to-store-my-passwords(/?)$
    /blog/using-1password-for-free-to-store-my-passwords$1 permanent;

rewrite ^/how-to-make-your-hashnode-blog-load-faster(/?)$
    /blog/how-to-make-your-hashnode-blog-load-faster$1 permanent;

rewrite ^/proxy-pass-nginx(/?)$
    /blog/proxy-pass-nginx$1 permanent;

rewrite ^/bigbaskets-first-step-towards-open-source(/?)$
    /blog/bigbaskets-first-step-towards-open-source$1 permanent;

rewrite ^/generating-vanity-onion-addresses-for-tor-v3-hidden-services(/?)$
    /blog/generating-vanity-onion-addresses-for-tor-v3-hidden-services$1 permanent;

rewrite ^/my-proxmox-homelab-kept-freezing-every-few-hours(/?)$
    /blog/my-proxmox-homelab-kept-freezing-every-few-hours$1 permanent;

rewrite ^/reminders-on-slack-messages-and-even-snoozing-them(/?)$
    /blog/reminders-on-slack-messages-and-even-snoozing-them$1 permanent;

rewrite ^/what-are-the-top-10-skills-needed-for-a-product-management-role-written-by-notion-ai(/?)$
    /blog/what-are-the-top-10-skills-needed-for-a-product-management-role-written-by-notion-ai$1 permanent;

# Extra posts (not in original Hashnode sitemap listing)
rewrite ^/mysqls-weird-way-of-strip-typecasting-strings-to-integers(/?)$
    /blog/mysqls-weird-way-of-strip-typecasting-strings-to-integers$1 permanent;

# Old Hashnode slug had a hash suffix
rewrite ^/making-apt-decisions-while-you-code-to-save-money-4bcf1c89dc9c(/?)$
    /blog/making-apt-decisions-while-you-code-to-save-money$1 permanent;

# ── Series index pages ────────────────────────────────────────────────────────

rewrite ^/series/apis(/?)$
    /blog/tag/apis$1 permanent;

rewrite ^/series/nanobits(/?)$
    /blog/tag/nanobits$1 permanent;

# ── Old listing page ──────────────────────────────────────────────────────────

rewrite ^/posts(/?)$
    /blog$1 permanent;

# ── Feed & sitemap ────────────────────────────────────────────────────────────

# Astro generates sitemap-index.xml; redirect bare sitemap.xml for compatibility
rewrite ^/sitemap\.xml$
    /sitemap-index.xml permanent;

# rss.xml is already served at /rss.xml — no redirect needed.

